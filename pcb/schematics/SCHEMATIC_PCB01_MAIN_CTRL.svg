  <text x="800" y="790" text-anchor="middle" font-size="13">J9 +12V → U3 FIXED 5V → DevKit → SPI ke U4/U5 · UART/GPIO ke opto · RS485 · DFPlayer · J9 control ke IO</text>
  <text x="800" y="830" text-anchor="middle" font-size="12" fill="#718096">Sumber: D01E_Module_Optimization_Fase1.md v1.1 · D01E_Electrical_System_Design.md v3.7 · KiCad ERC clean</text>
  <text x="800" y="860" text-anchor="middle" font-size="12" fill="#c53030">Ini schematic BLOK untuk teknisi — bukan Gerber. Gerber layout seats masih harus di-regen sebelum fab.</text>

  <!-- Note box -->
  <rect x="40" y="900" width="1520" height="160" fill="#fffbeb" stroke="#d69e2e" stroke-width="2" rx="8"/>
  <text x="70" y="940" font-size="15" font-weight="700">Pin seat U3 FIXED (3 pin)</text>
  <text x="70" y="970" font-size="13">1 = VIN (+12V) · 2 = GND · 3 = VOUT (+5V_SYS) · TIDAK ADA pad ADJ</text>
  <text x="70" y="1005" font-size="15" font-weight="700">Pin seat MAX31856 (8 pin Adafruit-compatible)</text>
  <text x="70" y="1035" font-size="13">1 VIN · 2 3Vo(NC) · 3 GND · 4 DO(MISO) · 5 CS · 6 CLK · 7 DIN(MOSI) · 8 DRDY(NC)</text>
